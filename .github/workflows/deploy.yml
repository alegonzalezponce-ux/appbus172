
name: Publicar Appbus172

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos web
        run: |
          mkdir -p public
          if [ -f index.html ]; then
            cp index.html public/
          fi
          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest public/
          fi
          if [ -f sw.js ]; then
            cp sw.js public/
          fi
          if [ -d icons ]; then
            cp -r icons public/
          fi
          echo "Appbus172 preparada para publicación"

      - name: Subir archivos web
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
        
